services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio
      POSTGRES_DB: emporio
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql://emporio:emporio@db:5432/emporio
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-secret-at-least-32-bytes-long-ok}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
      CHAT_MODE: backend
      DATABASE_URL: postgresql://emporio:emporio@db:5432/emporio
      DATABASE_URL_UNPOOLED: postgresql://emporio:emporio@db:5432/emporio
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-at-least-32-bytes-long-ok}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-secret-at-least-32-bytes-long-ok}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata:
