services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio
      POSTGRES_DB: emporio
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
