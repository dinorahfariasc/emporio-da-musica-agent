[project]
name = "emporio-agent-api"
version = "0.1.0"
description = "Customer service agent API for Empório da Música"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.28",
    "psycopg-pool>=3.2",
    "langgraph==1.2.19",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.7",
    "langchain-core==1.7.3",
    "pyyaml>=6.0.3",
    "langchain-openai==1.7.3",
    "pyjwt>=2.9",
    "fastmcp==4.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "uvicorn>=0.32",
]
etl = ["pypdf>=5"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not gemini' --import-mode=importlib"
markers = [
    "gemini: calls the real Gemini API (opt-in: uv run pytest -m gemini)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
